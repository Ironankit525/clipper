[project]
name = "clipper"
version = "0.1.0"
description = "Long-form video -> viral shorts, locally"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "yt-dlp>=2024.10.7",
    "opencv-python-headless>=4.10,<5",
    "numpy>=1.26",
]

[tool.uv]
package = false
